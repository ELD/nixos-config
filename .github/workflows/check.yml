name: Check Nix Flake
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: check-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, distro: ubuntu-latest }
          - { name: macOS, distro: macos-latest }
    runs-on: ${{ matrix.platform.distro }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ssh-key: ${{ secrets.GHA_DK }}
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@v14
      - name: Install Determinate Nix with lazy trees enabled
        uses: DeterminateSystems/determinate-nix-action@v3.23.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: lazy-trees = true
      # - name: Use FlakeHub Cache
      #   uses: DeterminateSystems/flakehub-cache-action@main
      - name: Record runner and Nix diagnostics; plan native checks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "Runner OS: $(uname -s)"
            echo "Runner architecture: $(uname -m)"
            nix --version
            echo "Configured substituters:"
            nix show-config | grep '^substituters ='
          } 2>&1 | tee nix-runner-diagnostics.txt

          nix_flags=(--show-trace --accept-flake-config --fallback --allow-import-from-derivation --impure)
          native_system="$(nix eval "${nix_flags[@]}" --no-write-lock-file --raw --expr 'builtins.currentSystem' 2>nix-native-system.stderr)"
          native_system_status=$?
          if [ -s nix-native-system.stderr ]; then
            cat nix-native-system.stderr | tee -a nix-runner-diagnostics.txt
          fi
          if [ "$native_system_status" -ne 0 ] || [ -z "$native_system" ]; then
            echo "Could not determine native Nix system; skipping dry-run plan." | tee -a nix-runner-diagnostics.txt
            exit 0
          fi
          echo "Native Nix system: $native_system" | tee -a nix-runner-diagnostics.txt

          checks_json="$(nix eval "${nix_flags[@]}" --no-write-lock-file --json --apply builtins.attrNames ".#checks.${native_system}" 2>nix-check-plan-eval.stderr)"
          if [ $? -ne 0 ]; then
            cat nix-check-plan-eval.stderr
            echo "Could not evaluate native check names; skipping dry-run plan." | tee -a nix-runner-diagnostics.txt
            exit 0
          fi
          check_names="$(python3 -c 'import json, sys; print(" ".join(json.load(sys.stdin)))' <<< "$checks_json")"
          installables=()
          for check_name in $check_names; do
            installables+=(".#checks.${native_system}.${check_name}")
          done
          if [ ${#installables[@]} -gt 0 ]; then
            echo "Native check dry-run installables: ${installables[*]}"
            nix build --dry-run --no-write-lock-file --no-link "${installables[@]}" "${nix_flags[@]}" 2>&1 | tee nix-check-dry-run.txt
          else
            echo "No checks found for native Nix system $native_system." | tee nix-check-dry-run.txt
          fi
      - name: Free Disk Space (Linux)
        if: matrix.platform.name == 'Linux'
        run: |
          echo "Freeing up disk space on Linux CI"
          df -h
          sudo rm -rf /usr/share/dotnet/
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/.ghcup/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h
      - name: Check Nix Flake
        shell: bash
        run: |
          set +e
          set -o pipefail
          nix flake check -j auto --show-trace --accept-flake-config --fallback --allow-import-from-derivation --impure -L --log-format internal-json \
            2>&1 \
            | python3 -u -c 'import datetime, json, sys
          for line in sys.stdin:
              event = {
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
                  "message": line.rstrip("\n"),
              }
              print(json.dumps(event, ensure_ascii=False), flush=True)
          ' \
            | tee nix-check.events.jsonl
          pipeline_status=("${PIPESTATUS[@]}")
          nix_status=${pipeline_status[0]}
          printf '%s\n' "$nix_status" > nix-check-exit-code.txt
          if [ "$nix_status" -ne 0 ]; then
            exit "$nix_status"
          fi
          if [ "${pipeline_status[1]}" -ne 0 ] || [ "${pipeline_status[2]}" -ne 0 ]; then
            echo "Nix event logging failed (filter=${pipeline_status[1]}, tee=${pipeline_status[2]})." >&2
            exit 1
          fi
      - name: Summarize Nix build timings
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/nix-build-timings.py \
            --input nix-check.events.jsonl \
            --json-output nix-build-timings.json \
            --markdown-output nix-build-timings.md \
            --summary-file "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Upload Nix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-check-${{ matrix.platform.name }}
          retention-days: 7
          path: |
            nix-check.events.jsonl
            nix-native-system.stderr
            nix-check-exit-code.txt
            nix-runner-diagnostics.txt
            nix-check-plan-eval.stderr
            nix-check-dry-run.txt
            nix-build-timings.json
            nix-build-timings.md
          if-no-files-found: warn
